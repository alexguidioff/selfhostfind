version: 2
updates:
  # App dependencies (Next.js, Prisma, etc.) — see dependabot-auto-merge.yml for how patch/
  # minor bumps merge themselves once CI passes, while majors wait for manual review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    open-pull-requests-limit: 5
    # Major upgrades are intentionally not opened automatically for these packages.
    # Review and apply them explicitly, with the same required CI as any other change.
    ignore:
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: "prisma"
        update-types: [version-update:semver-major]
      - dependency-name: "next"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
        update-types: [version-update:semver-major]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      - dependency-name: "vitest"
        update-types: [version-update:semver-major]
      - dependency-name: "tailwindcss"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Keep the two Prisma packages in lockstep so we never end up with client 7.x + cli 5.x.
      - dependency-name: "@prisma/client"
        versions:
          - ">=6.a, <7.0.0"
          - ">=7.a"
      - dependency-name: "prisma"
        versions:
          - ">=6.a, <7.0.0"
          - ">=7.a"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
