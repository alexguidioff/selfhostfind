name: Daily discovery

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

concurrency:
  # Don't run two daily-discovery workflows concurrently: a manual dispatch overlapping
  # with the cron would clobber each other's writes. atomic scan claims in the pipeline
  # are the last line of defense, not the first.
  group: daily-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          # 22.9+ required: seed/discover/snapshot use node's --env-file-if-exists flag.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate

      - name: Apply Prisma migrations (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma migrate deploy

      - name: Run discovery pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_DISCOVERY_TOKEN }}
          AUTO_VERIFY_CONFIDENCE_THRESHOLD: ${{ vars.AUTO_VERIFY_CONFIDENCE_THRESHOLD }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_FORMAT: ${{ vars.ALERT_WEBHOOK_FORMAT }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: pnpm discover

      - name: Refresh catalog (re-analyze known repos)
        # Refresh sits between discovery and snapshot: it re-uses discover's analyses for
        # never-scanned rows and feeds the snapshot job fresh stars numbers. If it errors,
        # the catalog is still consistent with yesterday's snapshot — keep going.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_DISCOVERY_TOKEN }}
          # GitHub Actions exports repo variables as empty strings when unset;
          # $REFRESH_MAX_REPOS='' Number('') === 0 would silently select zero repos.
          # refresh.ts now treats empty / non-positive the same as missing, but
          # defaulting to a non-empty placeholder at the workflow level makes the
          # operator's intent visible in the GitHub UI and stops accidental no-ops.
          REFRESH_CONCURRENCY: ${{ vars.REFRESH_CONCURRENCY || '2' }}
          REFRESH_MAX_REPOS: ${{ vars.REFRESH_MAX_REPOS || '50' }}
          REFRESH_STALE_DAYS: ${{ vars.REFRESH_STALE_DAYS || '7' }}
          REFRESH_CLAIM_TTL_MS: ${{ vars.REFRESH_CLAIM_TTL_MS || '600000' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_FORMAT: ${{ vars.ALERT_WEBHOOK_FORMAT }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: pnpm refresh
        continue-on-error: true

      - name: Reconcile catalog against GitHub (renames/archival/deletion)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_DISCOVERY_TOKEN }}
          RECONCILE_CONCURRENCY: ${{ vars.RECONCILE_CONCURRENCY }}
          SCAN_RETENTION_DAYS: ${{ vars.SCAN_RETENTION_DAYS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_FORMAT: ${{ vars.ALERT_WEBHOOK_FORMAT }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: pnpm reconcile

      - name: Record metric snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_FORMAT: ${{ vars.ALERT_WEBHOOK_FORMAT }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: pnpm snapshot

      - name: Prune search-aggregate retention window
        # Mirror of the retention step in scripts/backup.sh so deployments that only
        # run via GitHub Actions (no scheduled backup job on the host) still get the
        # 30-day window the admin view relies on.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PGPASSWORD=$(echo "$DATABASE_URL" | sed -E 's|.*://[^:]+:([^@]+)@.*|\1|') \
          psql "$DATABASE_URL" -tAc "WITH d AS (DELETE FROM \"SearchAggregate\" WHERE \"dayUtc\" < NOW() - INTERVAL '30 days' RETURNING 1) SELECT count(*) FROM d;"
        continue-on-error: true
