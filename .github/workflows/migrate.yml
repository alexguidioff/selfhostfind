name: Migrate database

# Migrations are applied automatically inside the daily-discovery workflow before discover
# runs, so this workflow no longer needs to fire on every push. Keep it available as a
# manual trigger for when you want to apply a new migration without waiting for the daily
# run (e.g. right after merging a schema change on a branch that didn't go through CI).
on:
  workflow_dispatch: {}

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma migrate deploy
